
name: Blender 3D Prototype

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg

      - name: Render 3D animation
        run: |
          blender -b -t 2 --python scene.py

      - name: Assemble MP4
        run: |
          ffmpeg -y \
            -framerate 12 \
            -i /tmp/frame_%04d.png \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            prototype.mp4

      - name: Upload video and Blender project
        uses: actions/upload-artifact@v4
        with:
          name: prototype-3d
          path: |
            prototype.mp4
            /tmp/prototype.blend
          if-no-files-found: error
          retention-days: 3
          
